[versions]
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.8"
compose = "1.11.4"
lifecycle = "2.10.0"
koin = "4.2.2"
coroutines = "1.11.0"
room = "2.8.4"
composeDestinations = "2.3.0"
junit5 = "6.1.2"
kaspresso = "1.6.1"
ktlint = "14.2.0"
drawerlayout = "1.2.0"

[libraries]
core-ktx = { module = "androidx.core:core-ktx", version = "1.18.0" }
lifecycle-runtimeKtx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
lifecycle-viewmodelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.13.0" }
drawerlayout = { module = "androidx.drawerlayout:drawerlayout", version.ref = "drawerlayout" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-uiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-material = { module = "androidx.compose.material:material", version.ref = "compose" }
compose-uiTestJunit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }
compose-debugUiTooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-debugUiTestManifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose" }
accompanist = { module = "com.google.accompanist:accompanist-systemuicontroller", version = "0.36.0" }
composeDestinations-core = { module = "io.github.raamcosta.compose-destinations:core", version.ref = "composeDestinations" }
composeDestinations-ksp = { module = "io.github.raamcosta.compose-destinations:ksp", version.ref = "composeDestinations" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-testJunit4 = { module = "io.insert-koin:koin-test-junit4", version.ref = "koin" }
work-runtimeKtx = { module = "androidx.work:work-runtime-ktx", version = "2.11.2" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
leakCanary = { module = "com.squareup.leakcanary:leakcanary-android", version = "2.14" }
junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5" }
junit-android = { module = "androidx.test.ext:junit", version = "1.3.0" }
mockk = { module = "io.mockk:mockk", version = "1.14.11" }
kaspresso-core = { module = "com.kaspersky.android-components:kaspresso", version.ref = "kaspresso" }
kaspresso-compose = { module = "com.kaspersky.android-components:kaspresso-compose-support", version.ref = "kaspresso" }
documentFile = { module = "androidx.documentfile:documentfile", version = "1.1.0" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
gsonConverter = { module = "com.squareup.retrofit2:converter-gson", version = "3.0.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
